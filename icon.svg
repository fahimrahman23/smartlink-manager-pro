<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner glow circle -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Stylized SmartLink interlocking node / lightning arrow -->
  <g transform="translate(106, 106)" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left link loop -->
    <path d="M 120 70 L 75 115 A 45 45 0 0 0 138 178 L 175 141" />
    <!-- Right link loop -->
    <path d="M 180 230 L 225 185 A 45 45 0 0 0 162 122 L 125 159" />
    <!-- Fast forward redirect lightning bolt in center -->
    <path d="M 160 85 L 125 155 L 175 155 L 140 225" stroke="#38bdf8" stroke-width="18" fill="#38bdf8" />
  </g>

  <!-- Accent indicator dots -->
  <circle cx="370" cy="142" r="14" fill="#38bdf8" />
  <circle cx="142" cy="370" r="14" fill="#a855f7" />
</svg>
